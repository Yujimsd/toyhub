<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toy Haven | Feedback</title>
    <link rel="icon" href="../assets/icons/favicon.svg">
    <link rel="stylesheet" href="../assets/css/base.css">
    <link rel="stylesheet" href="../assets/css/forms.css">
    <link rel="stylesheet" href="../assets/css/feedback.css">
</head>
<body>

<div class="wrapper">

    <aside class="left-menu">
        <div class="left-menu-top">
            <a class="shop-logo" href="../index.html">Toy<span>Haven</span></a>
            <button class="menu-btn" aria-label="Toggle menu">☰</button>
        </div>
        <nav class="nav-list">
            <a href="../index.html"><span class="nav-pic">🏠</span>Home</a>
            <a href="product.html"><span class="nav-pic">🧸</span>Products</a>
            <a href="wishlist.html"><span class="nav-pic">💖</span>Wishlist</a>
            <a href="cart.html"><span class="nav-pic">🛒</span>Cart <span class="cart-num">0</span></a>
            <a href="feedback.html"><span class="nav-pic">💬</span>Feedback</a>
        </nav>
        <div class="left-menu-note"><strong>Toy Haven</strong>Simple toys, big imagination.</div>
    </aside>


    <div class="right-side">
        <main>
            <div class="big-box">
                <section class="top-title">
                    <span class="little-title">Talk To Us</span>
                    <h1>Feedback &amp; FAQ</h1>
                    <p>Contact us for support or reporting issues</p>
                </section>


                <section class="feedback-part">
                    <div class="topic-line" id="topic-line">
                        <span class="topic-text">What is it about?</span>
                        <button type="button" class="topic-btn is-on" onclick="pickTopic(this, 'General')">💬 General</button>
                        <button type="button" class="topic-btn" onclick="pickTopic(this, 'Toy suggestion')">🧸 Toy suggestion</button>
                        <button type="button" class="topic-btn" onclick="pickTopic(this, 'Order help')">📦 Order help</button>
                        <button type="button" class="topic-btn" onclick="pickTopic(this, 'Website bug')">🐞 Website bug</button>
                    </div>

                    <form id="fb-form" class="form-box" novalidate>
                        <div id="fb-msg" class="msg-box" style="display:none;"></div>
                        <div class="form-grid">
                            <div class="form-part">
                                <label for="fname">Name</label>
                                <input id="fname" name="name" required minlength="2">
                                <div class="error-text"></div>
                            </div>
                            <div class="form-part">
                                <label for="femail">Email</label>
                                <input id="femail" name="email" type="email" required>
                                <div class="error-text"></div>
                            </div>
                            <div class="form-part wide">
                                <label for="msg">Message</label>
                                <textarea id="msg" name="message" rows="6" required minlength="10"></textarea>

                                <div class="error-text"></div>
                            </div>
                        </div>
                        <button class="btn main-btn" style="margin-top:6px;">Submit Feedback</button>
                    </form>
                </section>

           
                <section class="question-part">
                    <div class="part-title">
                        <div><span class="little-title">Help</span><h2>Quick Answers</h2></div>
                    </div>
                    <div id="question-list" class="question-list"></div>
                </section>
            </div>
        </main>


        <footer>
            <div class="big-box foot-row">
                <span class="foot-name">Toy <span>Haven</span></span>
                <div class="foot-links">
                    <a href="../index.html">Home</a><a href="product.html">Products</a>
                    <a href="cart.html">Cart</a><a href="wishlist.html">Wishlist</a>
                    <a href="feedback.html">Feedback &amp; FAQ</a>
                </div>
                <p>© 2026 Toy Haven</p>
            </div>
        </footer>
    </div>
</div>


<script src="../assets/js/main.js"></script>
<script src="../assets/js/feedback.js"></script>
</body>
</html>
